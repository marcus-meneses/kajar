<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kajar</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (event) {
        var detail = String(event.error && event.error.message || event.message || "");
        if (!/service configuration|services\./i.test(detail)) return;
        var root = document.getElementById("root");
        if (root) root.innerHTML = '<main style="font:16px system-ui;padding:32px;color:#8b1e2d">Invalid service configuration. Contact the administrator.</main>';
      });
    </script>
    <script src="/app-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
